# Builds the installers on native runners:
#   Windows : qscreenrec-<ver>-windows-x64.exe (NSIS setup) + .zip (portable)
#   macOS   : qscreenrec-<ver>-macos.dmg (universal arm64 + x86_64)
#   Linux   : qscreenrec-<ver>-linux-x86_64.deb / .rpm / .tar.gz
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0 to also
# attach the files to a GitHub release.
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-22.04 }
          - { name: macos,   os: macos-latest }
          - { name: windows, os: windows-2022 }

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm libpulse-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-randr0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "$EXTRA"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: qscreenrec-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/qscreenrec-*.exe
            build/qscreenrec-*.zip
            build/qscreenrec-*.dmg
            build/qscreenrec-*.deb
            build/qscreenrec-*.rpm
            build/qscreenrec-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
