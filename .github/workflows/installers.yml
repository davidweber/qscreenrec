# Builds the installers on native runners:
#   Windows : qscreenrec-<ver>-windows-x64.exe (NSIS setup) + .zip (portable)
#   macOS   : qscreenrec-<ver>-macos.dmg (universal arm64 + x86_64)
#   Linux   : qscreenrec-<ver>-linux-x86_64.deb / .rpm / .tar.gz
#
# Three ways to run it:
#   - Actions tab > Installers > Run workflow: builds the installers (download them as artifacts).
#   - The same, with "Publish a GitHub release" ticked: also creates the tag v<version> and a
#     release with the installers attached. <version> is the project version in CMakeLists.txt.
#   - Push a tag like v0.3.3, or publish a release with a new tag: builds and attaches the files.
name: Installers

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release (tag v<version from CMakeLists.txt>) with the installers"
        type: boolean
        default: false
  push:
    tags: ['v*']

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-22.04 }
          - { name: macos,   os: macos-latest }
          - { name: windows, os: windows-2022 }

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm libpulse-dev libpipewire-0.3-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-randr0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "$EXTRA"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: qscreenrec-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/qscreenrec-*.exe
            build/qscreenrec-*.zip
            build/qscreenrec-*.dmg
            build/qscreenrec-*.deb
            build/qscreenrec-*.rpm
            build/qscreenrec-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(sed -n 's/^project(QScreenRec VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            if [ -z "$VERSION" ]; then
              echo "::error::Could not read the project version from CMakeLists.txt"; exit 1
            fi
            TAG="v$VERSION"
            # A manual run never overwrites an existing release: bump the version instead.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists. Bump the version in CMakeLists.txt first."; exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QScreenRec ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
